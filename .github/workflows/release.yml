name: Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "minase-core-v[0-9]*"

permissions:
  contents: write

jobs:
  verify-and-draft:
    name: Verify crate and draft GitHub Release
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag metadata and verify Cargo.toml version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          tag = os.environ["TAG"]
          if tag.startswith("minase-core-v"):
              crate = "minase-core"
              version = tag.removeprefix("minase-core-v")
              manifest = pathlib.Path("crates/minase-core/Cargo.toml")
              changelog = "crates/minase-core/CHANGELOG.md"
          elif tag.startswith("v"):
              crate = "minase"
              version = tag.removeprefix("v")
              manifest = pathlib.Path("crates/minase/Cargo.toml")
              changelog = "CHANGELOG.md"
          else:
              sys.exit(f"unsupported release tag: {tag}")

          data = tomllib.loads(manifest.read_text(encoding="utf-8"))
          manifest_version = data["package"]["version"]
          if manifest_version != version:
              sys.exit(
                  f"tag {tag} expects {crate} version {version}, "
                  f"but {manifest} has {manifest_version}"
              )

          prerelease = "true" if "-" in version else "false"
          title = f"{crate} v{version}"

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"crate={crate}\n")
              out.write(f"version={version}\n")
              out.write(f"changelog={changelog}\n")
              out.write(f"prerelease={prerelease}\n")
              out.write(f"title={title}\n")
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run feature-gated engine tests
        run: cargo test -p minase --lib --features search-stats,tuning

      - name: Verify minase-core package
        if: steps.meta.outputs.crate == 'minase-core'
        run: cargo package -p minase-core --locked

      - name: Verify minase package contents
        if: steps.meta.outputs.crate == 'minase'
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          expected_nets = {
              "nets/nnue-epoch0-pst.bin",
              "nets/pst-init.bin",
              "nets/pst.bin",
              "nets/test-layer-stack.bin",
          }
          proc = subprocess.run(
              ["cargo", "package", "-p", "minase", "--list"],
              capture_output=True,
              text=True,
              check=True,
          )
          actual_nets = {
              line.strip()
              for line in proc.stdout.splitlines()
              if line.strip().startswith("nets/")
          }
          if actual_nets != expected_nets:
              sys.exit(
                  f"unexpected files under nets/ in minase package:\n"
                  f"  expected: {sorted(expected_nets)}\n"
                  f"  actual:   {sorted(actual_nets)}"
              )
          PY
          # minase-core may not be published to crates.io yet when both tags are pushed,
          # so packaging skips registry resolution here and leaves `cargo publish` manual.
          cargo package -p minase --locked --no-verify

      - name: Extract release notes from changelog
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          python3 scripts/extract_release_notes.py "$CHANGELOG" "$TAG" > release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; skipping draft creation."
            exit 0
          fi
          args=(
            release create "$TAG"
            --draft
            --verify-tag
            --title "$TITLE"
            --notes-file release-notes.md
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

[package]
name = "minase"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
mimalloc = "0.1.52"
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"
serde_json = "1"

[profile.dev]
opt-level = 3

[profile.release]
lto = true

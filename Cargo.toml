[workspace]
members = ["crates/minase", "crates/minase-core", "crates/minase-trainer"]
# A virtual manifest cannot infer the resolver. Resolver 1 unifies dev-dependency features
# with normal builds, which would enable `invariants` in `cargo build`.
# See docs/adr/arrange-crates-under-a-virtual-workspace.md.
resolver = "3"
# Other commits are unpacked under target/ (match_runner commit: specs, bench_compare.py), and
# other branches are checked out as worktrees under data/ and .claude/. Their Cargo projects
# are not members of this workspace.
exclude = ["target", "data", ".claude"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

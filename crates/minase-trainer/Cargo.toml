[package]
name = "minase-trainer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Trainer for minase's evaluation functions (development tool, not published)"

[[bin]]
name = "minase-trainer"
path = "src/main.rs"

[dependencies]
minase = { path = "../minase" }
minase-core = { path = "../minase-core" }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13040"] }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"

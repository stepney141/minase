# リポジトリのルートからの相対パス。prepare後の編集は実験へ反映されない。
[run]
directory = "data/pst-gen2"
# 採用済みコミットの完全ハッシュへ置き換える。
base_commit = "REPLACE_WITH_FULL_COMMIT_HASH"
data = [
  "data/gen0.bin",
  "data/gen1-s100000.bin",
  "data/gen1-s200000.bin",
  "data/gen1-s300000.bin",
  "data/gen1-s400000.bin",
  "data/gen1-s500000.bin",
]

[generate]
# 過去ログでも範囲の未使用を確認する。gen0b.binは入力へ加えない。
# 既存データだけで学習する場合は seeds = [] を明示する。
seeds = [600000, 700000, 800000, 900000, 1000000]
games = 7500
nodes = 100000
concurrency = 16
max_ply = 4000
hash_mb = 16
random_moves = 0

[train]
# 左右の鏡映対で重みを共有する2端点はmirrored、共有しない2端点はtapered。
# 世代2は段階7で採用したmirroredを使う。singleは両端点が一致する初期重みだけを受理する。
model = "mirrored"
# 出力Kは必須。段階7では採用済み重みのヘッダの値に固定する。
k = 1072.6529541015625
learning_rate = 3.0
epochs = 10
batch = 16384
seed = 1
# 省略時は来歴のλを使う。自己対局だけを上書きする場合は0以上1以下の有限値を指定する。
# lambda_override = 1.0
# 全modelで必須。0は追加損失なし。正値はmirroredだけで使える。
# 係数は未選定のため0を例示する。実験では予備比較で採用した係数を転記する。
removal_penalty = 0
device = "cuda"
validation_sample = 10000
# 先読みを使う場合だけ指定する。省略時は元の探索値を使う。付け直しとは併用不可。
# lookahead = { gamma = 0.9, plies = 40 }
# 付け直しはrun.data、生成シードの順。なしは"-"。項目の省略は全てなし。
rescore = ["-", "-", "-", "-", "-", "-", "-", "-", "-", "-", "-"]

[diagnose]
sample_size = 10000
seed = 1

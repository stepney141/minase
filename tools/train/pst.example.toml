# PSTの学習設定の例。手順と各項目の意味は docs/guides/pst-training.md にある。
# パスはリポジトリのルートからの相対パスで書く。
# prepareを実行した後にこのファイルを編集しても、実験へは反映されない。
[run]
# data/ の下の未使用のディレクトリを指定する。
directory = "data/REPLACE_WITH_EXPERIMENT_NAME"
# 採用済みコミットの完全ハッシュへ置き換える。
base_commit = "REPLACE_WITH_FULL_COMMIT_HASH"
# 既存の学習データ（MNSD）をファイルごとに列挙する。各ファイルには来歴ファイルが必要。
data = [
  "data/REPLACE_WITH_EXISTING_DATA.bin",
]

[generate]
# 生成する場合は、各生成ファイルの基本シードを互いに生成局数以上離して列挙する。
# 過去の生成ログでも範囲が未使用であることを確認する。
# 空配列は、既存データだけで学習することを表す。
seeds = []
games = 7500
nodes = 100000
concurrency = 16
max_ply = 4000
hash_mb = 16
random_moves = 0

[train]
# 序中盤用と終盤用の2端点を学習するモデルには、左右の鏡映対で重みを共有するmirroredと、共有しないtaperedがある。
# 通常は採用済みPSTと同じmirroredを使う。
# singleは、初期重みの序中盤用と終盤用が一致する場合だけ使える。
model = "mirrored"
# モデル出力の尺度kの指定は必須である。
# 継続学習では、初期重みのヘッダに記録された値に合わせる。
k = 1072.6529541015625
learning_rate = 3.0
epochs = 10
# 打ち切りを使う場合だけ指定する。省略時はepochsまで学習する。
# patience = 5
batch = 16384
seed = 1
# 省略時は来歴ファイルに記録された教師混合比λを使う。
# 自己対局のλだけを上書きする場合は、0以上1以下の有限値を指定する。
# lambda_override = 1.0
# すべてのmodelで指定が必須であり、0は追加損失なしを表す。
# 正の値はmirroredだけで使える。
# 係数は未選定のため0を例示する。実験では予備比較で採用した係数を転記する。
removal_penalty = 0
device = "cuda"
validation_sample = 10000
# 先読みを使う場合だけ指定し、省略時は元の探索値を使う。
# 付け直しとは併用できない。
# lookahead = { gamma = 0.9, plies = 40 }
# 付け直しを使う場合だけ、run.data、生成シードの順に全ファイル分を列挙する。
# 付け直さないファイルには"-"を書く。
# 省略時は全ファイルを付け直しなしとする。
# rescore = ["-"]

[diagnose]
sample_size = 10000
seed = 1

# リポジトリのルートからの相対パス。prepare後の編集は実験へ反映されない。
[run]
directory = "data/pst-gen2"
# 採用済みコミットの完全ハッシュへ置き換える。
base_commit = "REPLACE_WITH_FULL_COMMIT_HASH"
data = [
  "data/gen0.bin",
  "data/gen1-s100000.bin",
  "data/gen1-s200000.bin",
  "data/gen1-s300000.bin",
  "data/gen1-s400000.bin",
  "data/gen1-s500000.bin",
]

[generate]
# 過去ログでも範囲の未使用を確認する。gen0b.binは入力へ加えない。
# 既存データだけで学習する場合は seeds = [] を明示する。
seeds = [600000, 700000, 800000, 900000, 1000000]
games = 7500
nodes = 100000
concurrency = 16
max_ply = 600
hash_mb = 16
random_moves = 0

[train]
# 序中盤と終盤の2端点はtapered、単一PSTはsingle。採用済みのPSTは両端点が異なるので、
# その続きを学習するならtaperedを指定する（singleは両端点が一致する初期重みだけを受理する）。
model = "tapered"
# 固定PSTへ2駒関係の補正を学習する場合は model = "fm" とし、次の4項目を追加する。
# rank = 32
# weight_decay = 0.0001
# lambda_res = 0.001
# patience = 3
# fmの開始条件は learning_rate = 0.001、epochs = 20、batch = 4096 とする。
# 既存データだけで学習する場合は上のgenerate.seedsを[]にする。
learning_rate = 3.0
epochs = 10
batch = 16384
seed = 1
lambda = 0.75
device = "cuda"
validation_sample = 10000

[diagnose]
sample_size = 10000
seed = 1

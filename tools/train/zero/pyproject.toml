[project]
name = "minase-zero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "torch>=2.13,<2.14",
    "onnx>=1.21",
    "onnxscript>=0.7",
    "onnxruntime-gpu==1.28.*",
    "tensorrt-cu13>=10.14,<10.15",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

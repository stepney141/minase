[project]
name = "minase-zero"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.11.0",
    "tensorrt-cu13-libs==10.14.1.48",
    "onnx",
    "numpy",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
tensorrt-cu13-libs = { index = "nvidia" }
